<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Confirmed — Metabolic Nuclear Medicine Platform</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #F7F9FA;
      color: #1E3A5F;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .checkmark {
      width: 56px;
      height: 56px;
      border-radius: 28px;
      background-color: #2E7D6B;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 20px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px;
    }
    p {
      font-size: 15px;
      color: #4B5563;
      line-height: 1.5;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="checkmark">&#10003;</div>
    <h1>Email Confirmed</h1>
    <p>
      Your email has been confirmed. You can close this page now and return
      to the Metabolic Nuclear Medicine Platform app to sign in. Your account
      will need approval from your institution's admin before you can start
      recording patient data.
    </p>
  </div>
</body>
</html>
