<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f4f4f5; }
    .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    input { width: 100%; padding: 0.75rem; margin: 0.5rem 0 1rem 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 0.75rem; background-color: #000; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:disabled { background-color: #a1a1aa; cursor: not-allowed; }
    .status { margin-top: 1rem; font-weight: 600; }
    .success { color: #16a34a; }
    .error { color: #dc2626; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Set New Password</h2>
    <p>Enter your new password below.</p>
    <form id="reset-form">
      <input type="password" id="new-password" placeholder="Enter new password" required minlength="6" />
      <button type="submit" id="submit-btn">Reset Password</button>
    </form>
    <div id="status-message" class="status"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://modfrkldfokqqxllypdz.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_y2kX5Z8YngTRjbhoBqt3Ww_6FBLvNFh";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('reset-form');
    const passwordInput = document.getElementById('new-password');
    const submitBtn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-message');

    // Automatically capture the access_token from the URL hash when arriving from email
    supabase.auth.onAuthStateChange(async (event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        statusMsg.className = 'status';
        statusMsg.textContent = 'Authenticated. Please enter your new password.';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = passwordInput.value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';
      statusMsg.textContent = '';

      const { data, error } = await supabase.auth.updateUser({ password: newPassword });

      if (error) {
        statusMsg.className = 'status error';
        statusMsg.textContent = 'Error: ' + error.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      } else {
        statusMsg.className = 'status success';
        statusMsg.textContent = 'Password reset successfully! You can now open your app and log in.';
        form.style.display = 'none';
      }
    });
  </script>

</body>
</html>
