<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Metabolic NM Platform</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f9ff; /* Light Sky Blue tint */
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      color: #0369a1; /* Primary Blue */
      text-align: center;
    }
    p {
      color: #64748b;
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    input {
      width: 100%;
      padding: 0.85rem;
      margin-bottom: 1rem;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
      font-size: 1rem;
    }
    input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    button {
      width: 100%;
      padding: 0.85rem;
      background-color: #0284c7; /* Clinical Blue Button */
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #0369a1;
    }
    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    .status {
      margin-top: 1.25rem;
      font-weight: 600;
      font-size: 0.95rem;
      text-align: center;
      line-height: 1.4;
    }
    .success {
      color: #16a34a;
    }
    .error {
      color: #dc2626;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Reset Password</h2>
    <p>Enter your new password for the Metabolic NM Platform.</p>
    
    <form id="reset-form">
      <input type="password" id="new-password" placeholder="New password (min 6 characters)" required minlength="6" />
      <button type="submit" id="submit-btn">Update Password</button>
    </form>
    
    <div id="status" class="status"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://modfrkldfokqqxllypdz.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_y2kX5Z8YngTRjbhoBqt3Ww_6FBLvNFh";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('reset-form');
    const passwordInput = document.getElementById('new-password');
    const submitBtn = document.getElementById('submit-btn');
    const statusDiv = document.getElementById('status');

    // 1. Set explicit session if hash fragment is present
    async function initSession() {
      const hash = window.location.hash.substring(1);
      if (hash) {
        const params = new URLSearchParams(hash);
        const accessToken = params.get('access_token');
        const refreshToken = params.get('refresh_token');
        
        if (accessToken) {
          await supabase.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken || ''
          });
        }
      }
    }
    initSession();

    // 2. Auth State change handler
    supabase.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
        statusDiv.className = 'status';
        statusDiv.textContent = 'Session ready. Enter your new password above.';
      }
    });

    // 3. Form submit event
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = passwordInput.value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';
      statusDiv.textContent = '';

      const { data, error } = await supabase.auth.updateUser({ password: newPassword });

      if (error) {
        statusDiv.className = 'status error';
        statusDiv.textContent = 'Error: ' + error.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      } else {
        statusDiv.className = 'status success';
        statusDiv.textContent = '✓ Password reset successfully! You can now log into your mobile app with your new password.';
        form.style.display = 'none';
      }
    });
  </script>

</body>
</html>
